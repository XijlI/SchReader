<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SchReader</title>
<link rel="stylesheet" href="reader.css">
</head>
<body>
<div id="progress"><i></i></div>

<header class="topbar">
  <div class="brand"><span class="mark">R</span><span>SchReader</span></div>
  <div class="topbar-doc">
    <div class="doc-title" id="docTitle"></div>
    <div class="topbar-src" id="srcLabel"></div>
  </div>
  <div class="tools">
    <button id="btnFav" title="Save this article to my library">☆</button>
    <button id="btnLib" title="My library">▤</button>
    <button id="btnType" title="Theme, typeface, size">Aa</button>
    <button id="btnRail" title="Toggle sidebar (z)">☰</button>
    <button id="btnDiag" title="Parse diagnostics">⋯</button>
    <span class="sep"></span>
    <a id="btnOriginal" class="ghost" title="Back to the publisher page in this tab — Ctrl-click to keep the reader open">Original ↗</a>
  </div>
</header>

<div id="page">
  <article class="paper" id="paper"></article>
  <aside class="rail" id="rail">
    <div class="rail-tabs" role="tablist">
      <button data-tab="sections" class="on" role="tab">Sections</button>
      <button data-tab="figures" role="tab">Figures<span class="count" id="figCount"></span></button>
      <button data-tab="references" role="tab">Refs<span class="count" id="refCount"></span></button>
    </div>
    <div class="rail-body" id="railBody"></div>
  </aside>
</div>

<div class="typeset" id="typeset" hidden>
  <section>
    <h4>Theme <output id="themeOut"></output></h4>
    <div class="swatches" id="themeRow"></div>
  </section>
  <section>
    <h4>Typeface</h4>
    <div class="fonts" id="fontRow"></div>
  </section>
  <section>
    <h4>Text size <output id="sizeOut"></output></h4>
    <div class="stepper">
      <button type="button" id="sizeDown" aria-label="Smaller text">A−</button>
      <input type="range" id="sizeRange" min="88" max="128" step="2" aria-label="Text size">
      <button type="button" id="sizeUp" aria-label="Larger text">A+</button>
    </div>
  </section>
  <section>
    <h4>Line height <output id="leadOut"></output></h4>
    <input type="range" id="leadRange" min="140" max="215" step="5" aria-label="Line height">
  </section>
  <section>
    <h4>Column width <output id="readOut"></output></h4>
    <input type="range" id="readRange" min="30" max="60" step="1" aria-label="Column width">
  </section>
  <section>
    <h4>Custom colours <output id="contrastOut"></output></h4>
    <div class="colors">
      <label>Background <input type="color" id="colBg" aria-label="Background colour"></label>
      <label>Text <input type="color" id="colFg" aria-label="Text colour"></label>
      <label>Accent <input type="color" id="colAccent" aria-label="Accent colour"></label>
    </div>
    <p class="typeset-hint">Two colours are enough — every other shade is mixed from them.</p>
  </section>
</div>

<div class="pop" id="pop" hidden></div>

<button id="hlBar" class="hlbar" type="button" hidden
        title="Highlight — left click (right click for colours)">
  <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3.4 20.9l3.9-1 10.9-10.9-2.9-2.9L4.4 17l-1 3.9zM18.5 4.6l2.9 2.9 1.2-1.2a1.9 1.9 0 0 0 0-2.7l-.2-.2a1.9 1.9 0 0 0-2.7 0l-1.2 1.2z"/></svg>
</button>
<div id="hlPal" class="hlpal" hidden></div>

<div class="lb" id="lb" hidden>
  <button class="lb-bar lb-close" id="lbClose" title="Close (Esc)">✕</button>
  <div class="lb-stage" id="lbStage"><img id="lbImg" alt="" referrerpolicy="no-referrer"></div>
  <div class="lb-bar">
    <button id="lbPrev" title="Previous figure (←)">←</button>
    <button id="lbNext" title="Next figure (→)">→</button>
    <span class="cap" id="lbCap"></span>
    <button id="lbZoomOut" title="Zoom out">−</button>
    <button id="lbReset" title="Reset zoom (0)">100%</button>
    <button id="lbZoomIn" title="Zoom in">+</button>
    <a id="lbOpen" target="_blank" rel="noopener noreferrer">Open image ↗</a>
  </div>
</div>

<div id="toast"></div>

<script src="theme.js"></script>
<script src="library-store.js"></script>
<script src="translate.js"></script>
<script src="reader.js"></script>
</body>
</html>
